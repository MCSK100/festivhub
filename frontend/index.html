<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/festivlink-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:wght@300..700&family=Playfair+Display:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Core SEO Meta Tags -->
    <title>FestivLink — Find the right vendors for your event</title>
    <meta name="description" content="Discover photographers, caterers, decorators, makeup artists, venues and more. Browse local professionals and send a booking request directly.">
    <meta name="keywords" content="event vendors, wedding photographer, catering, decoration, makeup artist, venues, DJ, mehendi, event planning, FestivLink">
    <meta name="author" content="FestivLink">
    <meta name="theme-color" content="#1e4137">
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="FestivLink — Find the right vendors for your event">
    <meta property="og:description" content="Discover photographers, caterers, decorators, makeup artists, venues and more. Browse local professionals and send a booking request directly.">
    <meta property="og:image" content="/og-image.jpg">
    <meta property="og:url" content="https://festivlink.vercel.app">
    <meta property="og:site_name" content="FestivLink">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="FestivLink — Find the right vendors for your event">
    <meta name="twitter:description" content="Discover photographers, caterers, decorators, makeup artists, venues and more. Browse local professionals and send a booking request directly.">
    <meta name="twitter:image" content="/og-image.jpg">
    
    <!-- Additional SEO Meta Tags -->
    <meta name="robots" content="index, follow">
    <meta name="language" content="English">
    <meta name="revisit-after" content="7 days">
    <meta name="expires" content="never">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://festivlink.com">
    
    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "FestivLink",
      "url": "https://festivlink.com",
      "description": "Premium event management and service provider booking platform",
      "image": "/og-image.jpg",
      "sameAs": ["https://www.facebook.com/festivlink", "https://www.instagram.com/festivlink", "https://www.twitter.com/festivlink"],
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+1-800-EVENTS",
        "contactType": "Customer Service"
      }
    }
    </script>
    
    <!-- Service Aggregator Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "FestivLink",
      "image": "/og-image.jpg",
      "description": "Event service aggregator connecting customers with verified professionals",
      "areaServed": "IN",
      "priceRange": "$$",
      "ratingValue": "4.9",
      "ratingCount": "5000",
      "reviewCount": "5000"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
